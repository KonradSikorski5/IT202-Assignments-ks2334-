<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Show or Hide Password</title>
<style>
#password {
    background-color: #98ff98;
}
</style>
<script>
function togglePassword() {
    var passwordBox = document.getElementById("password");

    if (passwordBox.type == "password") {
        passwordBox.type = "text";
        passwordBox.style.backgroundColor = "#add8e6";
    }
    else {
        passwordBox.type = "password";
        passwordBox.style.backgroundColor = "#98ff98";
    }
}
</script>
</head>
<body>
<h3>Click on the password to show or hide password:</h3>
<form>
    <label for="password"><strong>Password:</strong></label>
    <input type="password" id="password" name="password" onclick="togglePassword()">
</form>
</body>
</html>
